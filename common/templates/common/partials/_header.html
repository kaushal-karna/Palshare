{% load common_static %}

<header class="topbar border-b border-pal-border bg-pal-surface/95 backdrop-blur-xl">

  <div class="topbar-inner mx-auto flex min-h-[72px] w-full max-w-[1440px] items-center gap-3 px-4 sm:px-5 lg:min-h-[76px] lg:gap-5 lg:px-6 xl:gap-6">

    <!-- Brand -->
    <a
      class="brand group flex shrink-0 items-center gap-2 no-underline lg:w-[220px] xl:w-[240px]"
      href="{% url 'posts:feed' %}"
      aria-label="PalShare home"
    >
      <img
        class="brand-mark h-10 w-10 shrink-0 object-contain transition-transform duration-200 group-hover:scale-105 sm:h-11 sm:w-11"
        src="{% versioned_static 'common/images/logo_final.png' %}"
        alt=""
        width="44"
        height="44"
      >

      <span class="brand-wordmark text-[1.45rem] font-extrabold tracking-[-0.04em] text-pal-text sm:text-[1.55rem]">
        Pal<span class="text-pal-accent">Share</span>
      </span>
    </a>

    <!-- Desktop / tablet search -->
    <form
      class="searchbar topbar-search relative hidden min-w-0 max-w-[620px] flex-1 md:flex"
      action="{% url 'search:search' %}"
      method="get"
      role="search"
      aria-label="Search PalShare"
    >
      <label
        class="sr-only"
        for="q"
      >
        Search people, posts, or tags
      </label>

      <input
        id="q"
        type="search"
        name="q"
        placeholder="Search people, posts, tags"
        value="{{ request.GET.q|default:'' }}"
        autocomplete="off"
        class="h-11 w-full rounded-xl border border-pal-border bg-pal-bg px-4 pl-11 text-sm text-pal-text outline-none transition duration-150 placeholder:text-pal-muted focus:border-pal-accent focus:ring-2 focus:ring-pal-accent/15"
      >

      <button
        class="topbar-search-submit absolute left-2 top-1/2 flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded-lg text-pal-muted transition duration-150 hover:bg-pal-surface-2 hover:text-pal-text focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent"
        type="submit"
        aria-label="Search"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          aria-hidden="true"
        >
          <circle cx="10.5" cy="10.5" r="6.5"/>
          <path d="m16 16 4 4"/>
        </svg>
      </button>
    </form>

    <!-- Mobile search -->
    <a
      class="ml-auto flex h-10 w-10 shrink-0 items-center justify-center rounded-xl text-pal-text transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent md:hidden"
      href="{% url 'search:search' %}"
      aria-label="Search"
      title="Search"
    >
      <svg
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <circle cx="10.5" cy="10.5" r="6.5"/>
        <path d="m16 16 4 4"/>
      </svg>
    </a>

    <!-- Account actions -->
    <nav
      class="topbar-actions flex shrink-0 items-center gap-1 sm:gap-2"
      aria-label="Account navigation"
    >

      <details class="theme-menu relative">
        <summary
          class="topbar-icon flex h-10 w-10 cursor-pointer select-none items-center justify-center rounded-xl text-base text-pal-text transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent"
          aria-label="Choose theme"
          title="Choose theme"
        >
          <span aria-hidden="true">🌓</span>
          <span class="sr-only">Theme</span>
        </summary>

        <div class="theme-menu-panel absolute right-0 top-12 z-50 w-48 rounded-2xl border border-pal-border bg-pal-surface p-2 shadow-xl">
          <span class="theme-menu-label block px-3 pb-2 pt-1 text-xs font-semibold uppercase tracking-wide text-pal-muted">
            Appearance
          </span>

          <button
            class="theme-option flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
            data-theme-option="system"
            role="menuitemradio"
            aria-checked="false"
          >
            <span>🖥️ Default</span>
            <span class="theme-option-check" aria-hidden="true">✓</span>
          </button>

          <button
            class="theme-option flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
            data-theme-option="light"
            role="menuitemradio"
            aria-checked="false"
          >
            <span>☀️ Light</span>
            <span class="theme-option-check" aria-hidden="true">✓</span>
          </button>

          <button
            class="theme-option flex w-full items-center justify-between rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
            data-theme-option="dark"
            role="menuitemradio"
            aria-checked="false"
          >
            <span>🌙 Dark</span>
            <span class="theme-option-check" aria-hidden="true">✓</span>
          </button>

          <span
            class="theme-menu-label mt-1 block border-t border-pal-border px-3 pb-1 pt-2 text-xs text-pal-muted"
            data-theme-current-label
            aria-live="polite"
          >
            🖥️ Default
          </span>
        </div>
      </details>

      {% if current_user %}

        <!-- Inbox: desktop header shortcut -->
        <a
          class="topbar-icon hidden h-10 w-10 items-center justify-center rounded-xl text-pal-text transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent lg:flex"
          href="{% url 'messaging:inbox' %}"
          aria-label="Inbox"
          title="Inbox"
          {% if request.resolver_match.url_name == 'inbox' or request.resolver_match.url_name == 'thread' %}
            aria-current="page"
          {% endif %}
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <rect x="3" y="5" width="18" height="14" rx="3"/>
            <path d="m4 7 8 6 8-6"/>
          </svg>
        </a>

        <!-- Saved: desktop header shortcut -->
        <a
          class="topbar-icon hidden h-10 w-10 items-center justify-center rounded-xl text-pal-text transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent lg:flex"
          href="{% url 'posts:saved' %}"
          aria-label="Saved posts"
          title="Saved posts"
          {% if request.resolver_match.url_name == 'saved' %}
            aria-current="page"
          {% endif %}
        >
          <svg
            class="h-5 w-5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M6 20V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v15l-6-4-6 4Z"/>
          </svg>
        </a>

        <!-- Profile -->
        <a
          class="topbar-profile group flex items-center gap-2 rounded-xl px-1.5 py-1.5 transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent sm:gap-3 sm:px-2"
          href="{% url 'accounts:user-profile' current_user.username %}"
          aria-label="Your profile: {{ current_user.name|default:current_user.username }}"
        >
          <span class="avatar topbar-avatar flex h-10 w-10 shrink-0 items-center justify-center overflow-hidden rounded-full bg-pal-accent/10 text-pal-accent">
            {% include "common/partials/_avatar.html" with who=current_user %}
          </span>

          <span class="topbar-profile-text hidden min-w-0 sm:block">
            <span class="topbar-profile-name block max-w-28 truncate text-sm font-bold leading-tight text-pal-text">
              {{ current_user.name|default:current_user.username }}
            </span>

            <span class="topbar-profile-handle block max-w-28 truncate text-xs leading-tight text-pal-muted">
              @{{ current_user.username }}
            </span>
          </span>
        </a>

      {% else %}

        <a
          class="btn btn-primary rounded-xl px-4 py-2.5 text-sm font-semibold"
          href="{% url 'accounts:login' %}"
        >
          Log in
        </a>

      {% endif %}

    </nav>
  </div>
</header>
