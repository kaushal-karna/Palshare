{% comment %}
  Appearance menu: Default (system), Light, and Dark.
  Icons are SVG so they render the same on every OS.
{% endcomment %}
<details class="theme-menu relative">
  <summary
    class="topbar-icon theme-menu-trigger flex h-10 w-10 cursor-pointer select-none items-center justify-center rounded-xl text-pal-text transition duration-150 hover:bg-pal-surface-2 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-pal-accent"
    aria-label="Choose theme"
    title="Choose theme"
  >
    <svg class="theme-glyph theme-glyph-system h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="4" width="18" height="14" rx="2"/>
      <path d="M8 21h8"/>
      <path d="M12 18v3"/>
    </svg>
    <svg class="theme-glyph theme-glyph-light h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
    </svg>
    <svg class="theme-glyph theme-glyph-dark h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z"/>
    </svg>
    <span class="sr-only visually-hidden">Theme</span>
  </summary>

  <div class="theme-menu-panel absolute right-0 top-12 z-50 w-52 rounded-2xl border border-pal-border bg-pal-surface p-2 shadow-xl" role="menu" aria-label="Appearance">
    <span class="theme-menu-label block px-3 pb-2 pt-1 text-xs font-semibold uppercase tracking-wide text-pal-muted">
      Appearance
    </span>

    <button
      class="theme-option flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
      data-theme-option="system"
      role="menuitemradio"
      aria-checked="false"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <rect x="3" y="4" width="18" height="14" rx="2"/>
        <path d="M8 21h8M12 18v3"/>
      </svg>
      <span>Default</span>
      <span class="theme-option-check ml-auto" aria-hidden="true">✓</span>
    </button>

    <button
      class="theme-option flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
      data-theme-option="light"
      role="menuitemradio"
      aria-checked="false"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/>
      </svg>
      <span>Light</span>
      <span class="theme-option-check ml-auto" aria-hidden="true">✓</span>
    </button>

    <button
      class="theme-option flex w-full items-center gap-3 rounded-xl px-3 py-2 text-left text-sm transition hover:bg-pal-surface-2"
      data-theme-option="dark"
      role="menuitemradio"
      aria-checked="false"
    >
      <svg class="h-4 w-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <path d="M21 14.5A8.5 8.5 0 0 1 9.5 3 7 7 0 1 0 21 14.5Z"/>
      </svg>
      <span>Dark</span>
      <span class="theme-option-check ml-auto" aria-hidden="true">✓</span>
    </button>

    <span
      class="theme-menu-label mt-1 block border-t border-pal-border px-3 pb-1 pt-2 text-xs text-pal-muted"
      data-theme-current-label
      aria-live="polite"
    >
      Default
    </span>
  </div>
</details>
